name: Test public Git governance executor
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run stdlib governance tests
        run: python -m unittest discover -s qizhi-governance -p 'test_*.py' -v
      - name: Validate known good and rejected subjects
        run: |
          python -c "import sys;sys.path.insert(0,'qizhi-governance');from validate_git_workflow import validate_subject; assert not validate_subject('feat(repo): add portable CI'); assert validate_subject('bad subject')"
